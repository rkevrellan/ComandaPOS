<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ComandaPOS">
  <defs>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset=".5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#e5341f"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1e4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#brasa)"/>
  <rect width="64" height="64" rx="16" fill="url(#brillo)"/>
  <!-- sombra de la comanda -->
  <path d="M20 15h21l8 8v30a2.5 2.5 0 0 1-2.5 2.5H20a2.5 2.5 0 0 1-2.5-2.5V17.5A2.5 2.5 0 0 1 20 15z" fill="#7c1d0d" opacity=".28"/>
  <!-- comanda: hoja con esquina doblada -->
  <path d="M18.5 11.5h21l8 8v31a2.5 2.5 0 0 1-2.5 2.5H18.5a2.5 2.5 0 0 1-2.5-2.5v-36.5a2.5 2.5 0 0 1 2.5-2.5z" fill="url(#hoja)"/>
  <path d="M39.5 11.5v8h8" fill="#ffd2a8"/>
  <!-- líneas del pedido -->
  <rect x="22" y="23" width="15" height="3.4" rx="1.7" fill="#9a2a0c"/>
  <rect x="22" y="30.5" width="20" height="3.4" rx="1.7" fill="#ffad6b"/>
  <rect x="22" y="38" width="12" height="3.4" rx="1.7" fill="#ffad6b"/>
  <!-- visto bueno -->
  <circle cx="43" cy="46.5" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <path d="M39.2 46.6l2.7 2.7 4.8-5.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
